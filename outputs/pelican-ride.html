<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <title>鹈鹕的兜风日 · Pelican on a Bicycle</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3e9; --ink: #244c48; --muted: #73847a; --line: #d8ddcd; --accent: #d66e48; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { max-width: 1550px; margin: auto; padding: 38px 5vw 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .wordmark { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    .wordmark svg { width: 31px; height: 31px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: 2px; }
    .intro { margin-top: 39px; position: relative; z-index: 1; pointer-events: none; }
    .eyebrow { font-size: 10px; letter-spacing: 3px; color: var(--accent); font-weight: 700; margin: 0 0 12px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 53px); font-weight: 500; letter-spacing: 3px; line-height: 1.3; }
    .description { color: var(--muted); font-size: 13px; letter-spacing: 1px; line-height: 1.8; margin: 12px 0 0; }
    .scene-wrap { position: relative; margin: -44px -2.5vw 0; }
    #scene { display: block; width: 100%; height: auto; overflow: hidden; }
    .controls { border-top: 1px solid var(--line); margin-top: -15px; padding: 21px 0 13px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .actions { display: flex; align-items: center; gap: 10px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); color: var(--ink); background: transparent; height: 42px; padding: 0 16px; border-radius: 24px; font-size: 12px; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #e6eada; transform: translateY(-1px); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    button svg { width: 16px; height: 16px; }
    #toggle { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 106px; }
    #toggle:hover { background: #36665e; }
    .speed { display: flex; align-items: center; gap: 13px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    input[type=range] { width: 120px; accent-color: var(--ink); height: 4px; cursor: pointer; }
    output { color: var(--ink); min-width: 31px; font-variant-numeric: tabular-nums; }
    footer { display: flex; justify-content: space-between; color: #89958a; font-size: 10px; letter-spacing: 1.5px; padding-top: 10px; }
    .sun-halo { transform-origin: 1160px 165px; }
    #bell-note { opacity: 0; }
    @media (max-width: 650px) {
      .page { padding: 24px 6vw; overflow: hidden; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .wordmark { font-size: 11px; letter-spacing: 1px; }
      .intro { margin-top: 34px; }
      h1 { font-size: 32px; }
      .description { max-width: 240px; font-size: 12px; }
      .scene-wrap { width: 155%; margin: -2px -27.5% 0; }
      .controls { margin-top: 0; flex-wrap: wrap; padding-top: 18px; gap: 20px; }
      .speed { margin-left: auto; }
      input[type=range] { width: 93px; }
      button { padding: 0 13px; }
      footer { line-height: 1.8; gap: 20px; margin-top: 10px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="wordmark">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14.5" stroke="currentColor"/><path d="M5 21c4-5 8-5 12-1m-5-5c0-6 5-8 7-5 1 2-1 4-1 6l7 1-7 3c-1 5-7 5-10 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18.6" cy="11.5" r=".8" fill="currentColor"/></svg>
        慢游俱乐部

      <span class="edition">LITTLE RIDES, BIG JOY / 001</span>

    <div class="intro">

      <h1>今天，慢慢骑。</h1>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const ns = 'http://www.w3.org/2000/svg';
      const tau = Math.PI * 2;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reduceMotion.matches;
      let speed = 1;
      let clock = 0;
      let last = null;
      let bellTime = -100;
      let audio = null;
      let frame = null;
      const nodes = Object.fromEntries([
        'rider', 'rear-spokes', 'front-spokes', 'far-leg', 'far-foot', 'far-pedal',
        'near-leg', 'near-leg-highlight', 'near-foot', 'near-crank', 'near-pedal',
        'scarf-tail-back', 'scarf-tail-front', 'clouds', 'distant-trees', 'ripples',
        'bank-plants', 'road-marks', 'foreground-plants', 'wind', 'eye', 'closed-eye',
        'bell-note', 'shadow', 'far-birds'
      ].map(id => [id, $(id)]));

      // Each spoke is a real SVG line, so the scene stays crisp at any size.
      for (const id of ['rear-spokes', 'front-spokes']) {
        for (let i = 0; i < 12; i++) {
          const a = i * tau / 12;
          const line = document.createElementNS(ns, 'line');
          line.setAttribute('x1', 10 * Math.cos(a));
          line.setAttribute('y1', 10 * Math.sin(a));
          line.setAttribute('x2', 93 * Math.cos(a));
          line.setAttribute('y2', 93 * Math.sin(a));
          nodes[id].appendChild(line);
        }
      }

      // Tile the scenery once; continuous translation can then wrap invisibly.
      const tracks = [
        ['clouds', 7], ['distant-trees', 14], ['ripples', 24],
        ['bank-plants', 43], ['road-marks', 117], ['foreground-plants', 145]
      ].map(([id, rate]) => {
        const original = nodes[id];
        const layer = document.createElementNS(ns, 'g');
        original.parentNode.insertBefore(layer, original);
        layer.appendChild(original);
        for (const offset of [-1440, 1440]) {
          const copy = original.cloneNode(true);
          copy.removeAttribute('id');
          copy.setAttribute('transform', `translate(${offset} 0)`);
          layer.appendChild(copy);
        }
        return { layer, rate };
      });

      function leg(phase, near) {
        const hip = { x: near ? 667 : 654, y: near ? 450 : 448 };
        const foot = { x: 727 + 42 * Math.cos(phase), y: 615 + 42 * Math.sin(phase) };
        const ankle = { x: foot.x - 9, y: foot.y - 11 };
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 122, lower = 125;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + along * dx / distance + bend * dy / distance, y: hip.y + along * dy / distance - bend * dx / distance };
        const prefix = near ? 'near' : 'far';
        const path = `M${hip.x} ${hip.y} L${knee.x} ${knee.y} L${ankle.x} ${ankle.y}`;
        nodes[`${prefix}-leg`].setAttribute('d', path);
        if (near) nodes['near-leg-highlight'].setAttribute('d', path);
        nodes[`${prefix}-foot`].setAttribute('d', `M${ankle.x - 5} ${ankle.y - 5} Q${ankle.x + 5} ${ankle.y - 8} ${ankle.x + 8} ${ankle.y + 2} L${foot.x + 24} ${foot.y - 3} Q${foot.x + 29} ${foot.y + 3} ${foot.x + 18} ${foot.y + 4} L${foot.x - 13} ${foot.y + 2}Z`);
        if (near) {
          nodes['near-crank'].setAttribute('transform', `rotate(${phase * 180 / Math.PI} 727 615)`);
          nodes['near-pedal'].setAttribute('transform', `translate(${foot.x} ${foot.y})`);
        } else {
          nodes['far-pedal'].firstElementChild.setAttribute('d', `M727 615L${foot.x} ${foot.y}`);
          nodes['far-pedal'].lastElementChild.setAttribute('d', `M${foot.x - 13} ${foot.y}h26`);
        }
      }

      function draw() {
        const phase = clock * 3.1;
        const bob = Math.sin(phase * 2) * 1.3;
        nodes.rider.setAttribute('transform', `translate(0 ${bob})`);
        const rotation = clock * 117 / 104 * 180 / Math.PI;
        nodes['rear-spokes'].setAttribute('transform', `rotate(${rotation})`);
        nodes['front-spokes'].setAttribute('transform', `rotate(${rotation})`);
        leg(phase + Math.PI, false);
        leg(phase, true);
        for (const track of tracks) track.layer.setAttribute('transform', `translate(${-((clock * track.rate) % 1440)} 0)`);
        const flutter = Math.sin(clock * 7) * 7;
        const flutter2 = Math.sin(clock * 7 - 1.1) * 6;
        nodes['scarf-tail-back'].setAttribute('d', `M772 316Q729 ${302 + flutter2} 689 ${325 + flutter}l16 8-13 10Q739 ${321 + flutter2} 774 326Z`);
        nodes['scarf-tail-front'].setAttribute('d', `M770 316Q730 ${328 + flutter} 674 ${307 + flutter2}l10 16-15 7Q722 ${351 + flutter} 773 327Z`);
        nodes.wind.setAttribute('transform', `translate(${-Math.sin(clock * 1.5) * 13} 0)`);
        nodes.wind.setAttribute('opacity', .35 + .16 * Math.sin(clock * 2));
        nodes['far-birds'].setAttribute('transform', `translate(${-Math.sin(clock * .22) * 40} ${Math.sin(clock * 1.8) * 3})`);
        const blink = clock % 5.3 > 5.12;
        nodes.eye.setAttribute('opacity', blink ? 0 : 1);
        nodes['closed-eye'].setAttribute('opacity', blink ? 1 : 0);
        nodes.shadow.setAttribute('rx', 218 - bob * 2);
      }

      function animate(now) {
        frame = null;
        const dt = last === null ? 0 : Math.min((now - last) / 1000, .05);
        last = now;
        if (!paused) { clock += dt * speed; draw(); }
        const age = (now - bellTime) / 1000;
        nodes['bell-note'].setAttribute('opacity', age >= 0 && age < 1.1 ? Math.sin(Math.min(1, age / .12) * Math.PI / 2) * (1 - Math.max(0, age - .3) / .8) : 0);
        if (age >= 0 && age < 1.1) nodes['bell-note'].setAttribute('transform', `translate(882 ${365 - age * 22})`);
        if ((!paused || age < 1.1) && !document.hidden) frame = requestAnimationFrame(animate);
      }

      function start() {
        if (frame === null && !document.hidden) { last = null; frame = requestAnimationFrame(animate); }
      }

      function updateButton() {
        $('toggle').setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        $('toggle').setAttribute('aria-pressed', String(paused));
        $('toggle-label').textContent = paused ? '继续兜风' : '歇一会儿';
        $('pause-icon').innerHTML = paused ? '<path d="m5 2 9 6-9 6Z"/>' : '<path d="M4 3h3v10H4zm5 0h3v10H9z"/>';
      }

      $('toggle').addEventListener('click', () => { paused = !paused; updateButton(); start(); });
      $('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        $('speed-value').value = `${speed.toFixed(1)}×`;
        event.target.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
      });

      $('bell').addEventListener('click', () => {
        bellTime = performance.now();
        start();
        // Synthesize a small, warm bicycle bell. No sound files are needed.
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          if (!audio) audio = new AudioContext();
          audio.resume().catch(() => {});
          const t = audio.currentTime;
          for (const delay of [0, .16]) {
            for (const [frequency, volume] of [[1568, .10], [3136, .028], [4220, .012]]) {
              const oscillator = audio.createOscillator();
              const gain = audio.createGain();
              oscillator.type = 'sine';
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(0, t + delay);
              gain.gain.linearRampToValueAtTime(volume, t + delay + .005);
              gain.gain.exponentialRampToValueAtTime(.0001, t + delay + .75);
              oscillator.connect(gain);
              gain.connect(audio.destination);
              oscillator.start(t + delay);
              oscillator.stop(t + delay + .8);
              oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
            }
          }
        } catch (_) { /* The visual bell remains available when audio is disabled. */ }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (frame !== null) cancelAnimationFrame(frame);
          frame = null;
          last = null;
        } else start();
      });
      reduceMotion.addEventListener('change', event => {
        if (event.matches) { paused = true; updateButton(); }
      });
      draw();
      updateButton();
      if (!paused) start();
    })();
  </script>
</body>
</html>
